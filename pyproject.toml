[project]
name = "telegram-otp-auth"
version = "1.0.0"
description = "Website login via one-time codes delivered by a Telegram bot"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.13,<4",
    "redis>=5.2",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6", "httpx>=0.27", "fakeredis[lua]>=2.26", "asgi-lifespan>=2.1", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["otp_auth*"]

[tool.setuptools.package-data]
"otp_auth.web" = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"otp_auth/web/app.py" = ["S101"]

[tool.mypy]
strict = true
exclude = ["examples"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=otp_auth --cov-report=term-missing --cov-fail-under=85"
