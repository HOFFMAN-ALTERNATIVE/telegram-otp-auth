<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in with Telegram — demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <section id="step-start">
      <p>We'll send a one-time code to your Telegram.</p>
      <button id="btn-start" class="btn">Log in with Telegram</button>
    </section>
    <section id="step-code" hidden>
      <p>1. <a id="deep-link" target="_blank" rel="noopener">Open the bot</a> and press <b>Start</b>.</p>
      <p>2. Enter the code you received:</p>
      <form id="form-code">
        <label for="code" class="sr-only">One-time code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="12" required placeholder="123 456">
        <button class="btn" type="submit">Verify</button>
      </form>
      <p class="muted">Link expires in <span id="ttl"></span>s</p>
    </section>
    <section id="step-done" hidden>
      <p>✅ Logged in as Telegram user <b id="uid"></b></p>
      <button id="btn-logout" class="btn btn--ghost">Log out</button>
    </section>
    <p id="msg" role="status" aria-live="polite"></p>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
