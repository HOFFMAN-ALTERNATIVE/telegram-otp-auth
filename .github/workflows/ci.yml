name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy otp_auth tests
      - run: pytest
      - name: Example tests (llm-web-search)
        working-directory: examples/llm-web-search
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip && pip install . pip-audit
      - run: pip-audit --skip-editable

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start web + real Redis
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          docker compose up -d --build --wait --wait-timeout 120 web redis
      - name: Full login flow against real Redis (bot step simulated with the service)
        run: |
          set -euo pipefail
          CID=$(curl -fsS -X POST localhost:8000/auth/telegram/start | jq -r .challenge_id)
          CODE=$(docker compose exec -T web python -c "
          import asyncio
          from redis.asyncio import Redis
          from otp_auth.config import get_settings
          from otp_auth.service import OTPService
          async def m():
              s = get_settings(); r = Redis.from_url(s.redis_url, decode_responses=True)
              print((await OTPService(r, s).issue_code('$CID', 123))[1])
          asyncio.run(m())")
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/auth/telegram/verify -H 'content-type: application/json' -d "{\"challenge_id\":\"$CID\",\"code\":\"000000x\"}")" = 400
          curl -fsS -c jar -X POST localhost:8000/auth/telegram/verify -H 'content-type: application/json' -d "{\"challenge_id\":\"$CID\",\"code\":\"$CODE\"}"
          curl -fsS -b jar localhost:8000/auth/me | jq -e '.telegram_user_id == 123'
          # single use
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/auth/telegram/verify -H 'content-type: application/json' -d "{\"challenge_id\":\"$CID\",\"code\":\"$CODE\"}")" = 410
      - name: Bot image starts (module import check)
        run: docker compose run --rm --no-deps -e BOT_TOKEN= bot python -c "import otp_auth.bot.main, otp_auth.bot.handlers; print('ok')"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
